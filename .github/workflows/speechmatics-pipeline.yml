name: Speechmatics pipeline checks

on:
  push:
    paths:
      - "pipeline/speechmatics-speaker-archive/**"
      - ".github/workflows/speechmatics-pipeline.yml"
  pull_request:
    paths:
      - "pipeline/speechmatics-speaker-archive/**"
      - ".github/workflows/speechmatics-pipeline.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline/speechmatics-speaker-archive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pipeline/speechmatics-speaker-archive/requirements.txt
            pipeline/speechmatics-speaker-archive/requirements-dev.txt
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Reject secrets and runtime artifacts
        run: python scripts/check_public_tree.py
      - name: Run tests
        env:
          APP_SECRET_KEY: ci-only-not-a-real-secret
        run: pytest -q
